spring.application.name=menuprofit

# DB 접속 정보: 운영 환경에서는 반드시 환경변수(DB_PASSWORD)로 주입할 것
spring.datasource.url=jdbc:mysql://localhost:3306/menuprofit?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:Dnflskfk90!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 운영 환경에서는 validate 또는 none 으로 변경할 것
spring.jpa.hibernate.ddl-auto=update

# 개발 환경에서만 활성화 — 운영 시 false로 변경할 것
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

server.port=8080
