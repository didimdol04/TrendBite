spring.application.name=menuprofit

spring.config.import=optional:file:.env.properties

# DB 접속 정보: 운영 환경에서는 반드시 환경변수(DB_PASSWORD)로 주입할 것
spring.datasource.url=jdbc:mysql://localhost:3306/menuprofit?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 운영 환경에서는 validate 또는 none 으로 변경할 것
spring.jpa.hibernate.ddl-auto=update

# 개발 환경에서만 활성화 — 운영 시 false로 변경할 것
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

server.port=8080

# ──────────────────────────────────────────────────────────────
# [P1-2] 응답 한글 인코딩 강제 설정
# ──────────────────────────────────────────────────────────────
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# 서울시 열린데이터 광장 API 키 5종
seoul.api.commercial-dong-key=${SEOUL_COMMERCIAL_DONG_KEY}
seoul.api.commercial-area-key=${SEOUL_COMMERCIAL_AREA_KEY}
seoul.api.sales-key=${SEOUL_SALES_KEY}
seoul.api.traffic-key=${SEOUL_TRAFFIC_KEY}
seoul.api.facility-key=${SEOUL_FACILITY_KEY}

# 소진공 상가(상권)정보 API 키
sogongong.api.key=${SOGONGONG_API_KEY}

# ──────────────────────────────────────────────────────────────
# [P2-1] 입지 보정계수 Min-Max 기준값 (외부화)
# 실데이터 수집 후 5/95 percentile 기준으로 조정 권장.
# 미설정 시 LocationProperties의 기본값(명세 v2.0 추정치) 자동 사용.
# ──────────────────────────────────────────────────────────────
location.calculator.traffic-min=5000
location.calculator.traffic-max=40000
location.calculator.sales-min=10000000
location.calculator.sales-max=50000000
location.calculator.comp-min=0
location.calculator.comp-max=30

# ──────────────────────────────────────────────────────────────
# [P5-2] Kakao Geocoding API (백엔드 옵션, 활성화는 팀 합의 후)
# 키 미설정 시 KakaoGeocodingClient는 Optional.empty() 반환 — 비활성 상태
# ──────────────────────────────────────────────────────────────
kakao.api.rest-key=${KAKAO_REST_KEY:}

# 로그 레벨
logging.level.com.trendbite.menuprofit.location=INFO

# FastAPI 트렌드 분석 서버
fastapi.base-url=${FASTAPI_URL}
fastapi.api-key=${FASTAPI_API_KEY}
fastapi.timeout-seconds=60

# 트렌드 분석 결과 캐시 TTL (시간)
trend.cache.ttl-hours=6

# 트렌드 도메인 로그 레벨
logging.level.com.trendbite.menuprofit.trend=INFO
